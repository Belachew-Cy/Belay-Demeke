{#
  Inline line icons shared by base.html, the landing page and the dashboard.
  Each icon inherits its colour from the surrounding text and is hidden from
  assistive technology, so every use needs a visible or aria-label text.
#}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

  <path d="M3.5 10.5 12 3.8l8.5 6.7" /><path d="M5.6 9.4V20.2h12.8V9.4" /><path d="M9.9 20.2v-5.4h4.2v5.4" />

{%- elif name == "users" -%}

  <path d="M16.2 5.4a3.1 3.1 0 0 1 0 5.9" /><path d="M17.4 15.1c2 .5 3.2 2 3.2 4.5" />
{%- elif name == "user-plus" -%}

  <path d="M17.5 14.5v5.2M14.9 17.1h5.2" />

</svg>
